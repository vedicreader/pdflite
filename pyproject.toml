[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdflite"
dynamic = ["version"]
description = "PDF to markdown: layout repair, OCR fallback, and images on disk"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev', 'pdf', 'markdown', 'ocr', 'layout', 'document conversion']
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "fastcore>=2.2.15",
    "pdf-oxide>=0.3.17",
]

[project.urls]
Repository = "https://github.com/vedicreader/pdflite"
Documentation = "https://vedicreader.github.io/pdflite/"

[project.entry-points.nbdev]
pdflite = "pdflite._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["pdflite"]

[tool.hatch.build.targets.sdist]
include = ["/pdflite", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "pdflite/__init__.py"

[dependency-groups]
dev = ["ipykernel>=7.3.0", "nbdev>=3.3.4", "notebook>=7.6.1", "liteparse>=2.6.0"]
